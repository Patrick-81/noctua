<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDIGO Devices</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>INDIGO Devices</h1>
        <div id="connection-status" class="status-dot disconnected"></div>
        <span id="connection-label">deconnecte</span>
    </header>

    <div id="split-container">
        <!-- Left panel: controls -->
        <div id="left-panel">
            <div id="left-scroll">
                <section id="devices-section">
                    <div id="devices-container"></div>
                </section>

                <!-- Mount panel -->
                <div id="mount-panel" style="display:none">
                    <div class="mount-coords">
                        <div class="coord-block">
                            <span class="coord-label">RA</span>
                            <span class="coord-sexa" id="mount-ra-sexa">--:--:--</span>
                            <span class="coord-dec" id="mount-ra-dec">--.---- h</span>
                        </div>
                        <div class="coord-block">
                            <span class="coord-label">DEC</span>
                            <span class="coord-sexa" id="mount-dec-sexa">+--:--:--</span>
                            <span class="coord-dec" id="mount-dec-dec">--.---- deg</span>
                        </div>
                        <div class="mount-status">
                            <span id="mount-tracking" class="badge badge-off">TRACK OFF</span>
                            <span id="mount-park" class="badge">UNPARKED</span>
                            <span id="mount-slew" class="badge badge-busy" style="display:none">SLEWING</span>
                        </div>
                    </div>

                    <div class="mount-controls">
                        <!-- GOTO -->
                        <div class="mount-section">
                            <h3>GOTO</h3>
                            <div class="goto-row">
                                <label>RA <input type="text" id="goto-ra" class="prop-input" placeholder="hh:mm:ss" value=""></label>
                                <label>DEC <input type="text" id="goto-dec" class="prop-input" placeholder="dd:mm:ss" value=""></label>
                                <button class="set-btn" onclick="mountGoto()">Slew</button>
                            </div>
                        </div>

                        <!-- D-pad -->
                        <div class="mount-section">
                            <h3>Mouvement</h3>
                            <div class="dpad-area">
                                <select id="slew-speed" class="prop-input">
                                    <option value="Guide">Guide</option>
                                    <option value="Centering">Centering</option>
                                    <option value="Find" selected>Find</option>
                                    <option value="Max">Max</option>
                                </select>
                                <div class="dpad">
                                    <button class="dpad-btn dpad-n" onmousedown="mountMove('N')" onmouseup="mountHaltMove()">N</button>
                                    <button class="dpad-btn dpad-w" onmousedown="mountMove('W')" onmouseup="mountHaltMove()">W</button>
                                    <button class="dpad-btn dpad-stop" onclick="mountAbort()">STOP</button>
                                    <button class="dpad-btn dpad-e" onmousedown="mountMove('E')" onmouseup="mountHaltMove()">E</button>
                                    <button class="dpad-btn dpad-s" onmousedown="mountMove('S')" onmouseup="mountHaltMove()">S</button>
                                </div>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="mount-section">
                            <h3>Actions</h3>
                            <div class="controls">
                                <button class="set-btn" onclick="mountToggleTracking()">Tracking</button>
                                <button class="set-btn" onclick="mountPark()">Park</button>
                                <button class="set-btn" onclick="mountUnpark()">Unpark</button>
                                <button class="set-btn btn-home" onclick="mountHome()">Home</button>
                                <button class="set-btn btn-abort" onclick="mountAbort()">Abort</button>
                            </div>
                        </div>

                        <!-- OnStep status -->
                        <div class="mount-section" id="onstep-status-section" style="display:none">
                            <h3>OnStep Status</h3>
                            <div class="onstep-status" id="onstep-status-text"></div>
                        </div>
                    </div>
                </div>

                <div id="device-props"></div>
            </div>
        </div>

        <!-- Resizer -->
        <div id="split-handle"></div>

        <!-- Right panel: sky chart -->
        <div id="right-panel">
            <div id="sky-chart-container">
                <canvas id="sky-canvas"></canvas>
                <div id="sky-chart-wait">Chargement des catalogues...</div>
            </div>
            <div id="sky-chart-info">
                <span id="sky-chart-status"></span>
            </div>
        </div>
    </div>

    <footer>
        <div id="log-header">
            <h2>Log</h2>
            <div id="log-filters">
                <label><input type="checkbox" checked data-level="info"> info</label>
                <label><input type="checkbox" checked data-level="warning"> warn</label>
                <label><input type="checkbox" checked data-level="error"> error</label>
                <label><input type="checkbox" data-level="debug"> debug</label>
            </div>
            <button id="log-clear" onclick="clearLog()">Clear</button>
        </div>
        <div id="log"></div>
    </footer>

    <script type="module" src="/app.js"></script>
</body>
</html>
