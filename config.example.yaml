# Noctua — Exemple de configuration
# Copiez ce fichier vers config.yaml puis ajustez les valeurs.
indigo:
  host: 127.0.0.1        # adresse du serveur INDIGO (modifiez selon votre réseau)
  port: 7624
web:
  host: 0.0.0.0             # interface d'écoute (0.0.0.0 = LAN local)
  port: 8080
site:
  name: Montdurausse
  latitude: 43.952          # degrés Nord
  longitude: 1.568          # degrés Est
  elevation: 210            # mètres
  timezone: Europe/Paris
telescope:
  flip_enabled: true
  hour_angle_margin: 0.2
  min_altitude: 5.0
  flip_slew_rate: Centering
  recenter_after_flip: true
exposure:
  target_bg: 4000            # fond de ciel cible (ADU au-dessus du bias)
  shots: 1                   # 1 = une pose (bias = BZERO) ; 3 = fit linéaire ADU(t)=bias+m·t
  test_min: 5.0              # pose de test la plus courte (s)
  test_mid: 15.0             # pose intermédiaire (mode 3 prises)
  test_max: 30.0             # pose de test la plus longue (s)
  min_exposure: 1.0
  max_exposure: 600.0
  saturation_frac: 0.6       # les pics d'étoiles restent sous cette fraction du plein-échelle
sequence:
  save_dir: ~/asteo/captures/
  dither:
    enabled: true
    amount: 2.0                  # σ du décalage gaussien (px)
    settle_rms: 1.0              # seuil de stabilisation du guidage (″) — 0 = pas d'attente
    settle_timeout: 20.0         # temps max d'attente du settle (s)
    settle_stable: 3             # échantillons consécutifs sous le seuil pour considérer le settle OK
  stack:
    enabled: false
    max_frames: 0
  frames:
    - duration: 60.0
      frame_type: LIGHT
      filter: ""
      count: 1
      delay: 1.0
  # ── Trigger Manager (Lot A2) ─────────────────────────────────
  # Événements : sequence_start, frame_start, frame_done, dither_done,
  #              error, series_done, stop
  # Actions :    log (message, level), script (command, timeout),
  #              mount_goto (ra [h], dec [°] — "now" = position actuelle)
  # Ceci est un exemple — commentez ou retirez ce qui ne s'applique pas.
  triggers:
    - name: alerte-fin-de-serie
      event: series_done
      actions:
        - type: log
          level: info
          message: "Série terminée : {done}/{total} poses"
    - name: script-par-pose
      event: frame_done
      conditions:
        frame_type: LIGHT
      actions:
        - type: script
          command: "python3 ~/scripts/on_frame.py --filter {filter} --index {done}"
          timeout: 20
    - name: parking-sur-erreur
      event: error
      actions:
        - type: log
          level: error
          message: "Erreur de séquence : {error}"